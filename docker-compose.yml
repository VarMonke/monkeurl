services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monkeurl
      POSTGRES_USER: monkeurl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monkeurl-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monkeurl -d monkeurl"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://monkeurl:${POSTGRES_PASSWORD:-monkeurl-dev}@db:5432/monkeurl
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

  flusher:
    build: .
    command: ["python", "/app/manage.py", "flush_clicks", "--daemon"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://monkeurl:${POSTGRES_PASSWORD:-monkeurl-dev}@db:5432/monkeurl
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
